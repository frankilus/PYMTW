[project]
name = "pkb"
version = "0.1.0"
description = "Personal Knowledge Base — a self-updating, file-based knowledge system with MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "watchfiles>=0.21",
    "python-frontmatter>=1.1",
    "whoosh>=2.7",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
connectors = [
    "tweepy>=4.14",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "imaplib2>=3.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
pkb = "pkb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
